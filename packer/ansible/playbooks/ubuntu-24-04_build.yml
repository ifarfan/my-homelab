---
#
# ? Ubuntu 24.04 provisioning
#
- name: Provision Ubuntu 24.04
  hosts: default
  become: true
  gather_facts: true

  tasks:
    - name: Setup base Ubuntu
      ansible.builtin.include_role:
        name: base_24
      vars:
        is_hardware: true
        has_swap: true

    - name: Configure modern-linux utilities
      ansible.builtin.include_role:
        name: modern_unix
