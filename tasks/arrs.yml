---
version: '3'

includes:
  shared:
    taskfile: ./__shared.yml
    internal: true

vars:
  ARRS_HOST: "arrs"
  SERVICE_VAR: "{{.ARRS_HOST}}"

tasks:
  check:
    desc: 'Check "{{.ARRS_HOST}}" host vars'
    cmds:
      - task: shared:check-lxc-vars

  # ? Terraform
  create-lxc:
    desc: 'Create "{{.ARRS_HOST}}" host'
    cmds:
      - task: shared:create-lxc

  destroy-lxc:
    desc: 'Destroy "{{.ARRS_HOST}}" host'
    cmds:
      - task: shared:destroy-lxc

  update-dns:
    desc: 'Update DNS records for "{{.ARRS_HOST}}" host'
    cmds:
      - task: shared:update-dns

  # ? Ansible
  provision:
    desc: 'Provision "{{.ARRS_HOST}}" via Ansible'
    cmds:
      - task: shared:provision

  provision-traefik:
    desc: 'Provision "Traefik" on "{{.ARRS_HOST}}"'
    cmds:
      - task: shared:provision-app
        vars: {APP_NAME: 'traefik'}

  provision-arr-stack:
    desc: 'Provision "Arr-Stack" on "{{.ARRS_HOST}}"'
    cmds:
      - task: shared:provision-app
        vars: {APP_NAME: 'arr_stack'}

  provision-metube:
    desc: 'Provision "MeTube" on "{{.ARRS_HOST}}"'
    cmds:
      - task: shared:provision-app
        vars: {APP_NAME: 'metube'}

  provision-stash:
    desc: 'Provision "Stash" on "{{.ARRS_HOST}}"'
    cmds:
      - task: shared:provision-app
        vars: {APP_NAME: 'stash'}
