---
- name: Set dynamic hostname
  ansible.builtin.import_playbook: proxmox-get-hostname.yml
  vars:
    my_host: devbox

- name: Devbox provisioning
  hosts: "{{ hostvars['localhost']['my_fqdn_host'] }}"
  become: true
  gather_facts: true
  tasks:
    # ? Base OS install + fixings
    - name: Install Ubuntu base
      ansible.builtin.include_role:
        name: base_24
      vars:
        is_lxc: true

    - name: Install modern Unix utilities
      ansible.builtin.include_role:
        name: modern_unix

    - name: Install Restic
      ansible.builtin.include_role:
        name: restic

    # ? Docker daemon + docker compose apps
    - name: Install docker
      ansible.builtin.include_role:
        name: docker

    - name: Install docker_proxy
      ansible.builtin.include_role:
        name: docker_proxy

    - name: Install dozzle
      ansible.builtin.include_role:
        name: dozzle
      vars:
        is_agent: true

    # ? Docker apps
    - name: Install Traefik
      ansible.builtin.include_role:
        name: traefik
        apply:
          tags: traefik
      tags: traefik
      vars:
        hostname_in_uri: true

    - name: Install Wakapi
      ansible.builtin.include_role:
        name: wakapi
        apply:
          tags: wakapi
      tags: wakapi

    - name: Install Dev Server
      ansible.builtin.include_role:
        name: dev_server
        apply:
          tags: dev_server
      tags: dev_server
