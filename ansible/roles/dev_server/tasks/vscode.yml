---
- name: Install pre-reqs
  ansible.builtin.apt:
    pkg: "{{ item }}"
    state: present
  with_items: "{{ vscode_req_pkgs }}"

- name: Download armored key
  ansible.builtin.get_url:
    url: "{{ vscode_key_url }}"
    dest: "{{ vscode_key_path }}"
    mode: 0444
    validate_certs: true
  changed_when: false             # noqa: no-changed-when

- name: Add apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by={{ vscode_key_path }}] https://packages.microsoft.com/repos/vscode stable main"
    state: present
    filename: vscode
    update_cache: true

- name: Install Visual Studio Code
  ansible.builtin.apt:
    pkg: code
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_time }}"

- name: Create Repos directory
  ansible.builtin.file:
    path: "{{ vscode_repos_folder }}"
    state: directory
    mode: 0755

- name: Clone Github repos
  ansible.builtin.git:
    repo: '{{ vscode_repos_url }}/{{ item }}.git'
    dest: "{{ vscode_repos_folder }}/{{ item }}"
    version: main
  with_items: "{{ vscode_repos }}"

- name: Create Workspace file
  ansible.builtin.template:
    src: repos.code-workspace.j2
    dest: "{{ vscode_repos_folder }}/repos.code-workspace"
    owner: root
    group: root
    mode: 0644
